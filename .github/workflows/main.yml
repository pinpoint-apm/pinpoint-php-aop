name: Build

on: [push, pull_request, workflow_dispatch]

env:
  PINPOINT_C_AGENT_BRANCH: 0.7


jobs:
  PHPUnit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: [ '7.4','8.0','8.1','8.2']
    steps:
      - uses: actions/checkout@v2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2
          extensions: pinpoint_php-0.6.0
      - run: |
          composer install --prefer-dist
          vendor/bin/phpunit --configuration PHPUnit.xml --testsuit pinpoint --testdox

  PHPUnit-AOP:
    strategy:
      matrix:
        php-versions: [ '7.4','8.0','8.1','8.2','8.3']
    runs-on: ubuntu-latest
    services:
      redis:
        # Docker Hub image
        image: redis
        ports:
          - 6379:6379

      memcached:
        image: memcached:alpine3.20
        ports:
          - "11211:11211"          
    steps:
      - uses: actions/checkout@v2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2
          extensions: pinpoint_php-0.6.0, mongodb-mongodb/mongo-php-driver@1.19.3
      - run: |
          composer install --prefer-dist
          vendor/bin/phpunit --configuration PHPUnit_aop_libraries.xml --testsuit pinpoint --testdox          