name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  PHPUnit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: [ '7.4','8.0','8.1','8.2']
    steps:
      - uses: actions/checkout@v2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2
          extensions: pinpoint_php-https://github.com/eeliu/pinpoint-c-agent@feat-join-cut-5-11
      - run: |
          composer install --prefer-dist
          vendor/bin/phpunit --configuration PHPUnit.xml --testsuit pinpoint --testdox

  PHPUnit-AOP:
    strategy:
      matrix:
        php-versions: [ '7.4','8.0','8.1','8.2']
    runs-on: ubuntu-latest
    services:
      redis:
        # Docker Hub image
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2
          extensions: pinpoint_php-https://github.com/eeliu/pinpoint-c-agent@feat-join-cut, mongodb-mongodb/mongo-php-driver@1.19.3
      - run: |
          composer install --prefer-dist
          vendor/bin/phpunit --configuration PHPUnit_aop_libraries.xml --testsuit pinpoint --testdox          